name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly band report

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  # D7: same duels must hash identically on every OS. A mismatch here is a
  # determinism regression and blocks merge like any test failure.
  cross-os-determinism:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run -c Release --project src/Conduit.SimHarness -- run --duels 50 --matchup aggro:wall --seed-base 42 --out results.json
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: results.json

  compare-os-results:
    needs: cross-os-determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: All OS results must be byte-identical
        run: |
          sha256sum determinism-*/results.json
          test "$(sha256sum determinism-*/results.json | awk '{print $1}' | sort -u | wc -l)" -eq 1

  nightly-bands:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: 10k-duel band report (balance §9 — report-only until playtests calibrate)
        run: dotnet run -c Release --project src/Conduit.SimHarness -- run --duels 10000 --matchup aggro:wall --seed-base 1000 --out nightly.json
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-bands
          path: nightly.json
