name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly band report

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  # D7: same duels must hash identically on every OS. Each leg regenerates the
  # integer state hashes and asserts them against the committed golden — a
  # determinism regression (or cross-OS drift) fails the leg. No artifact storage.
  cross-os-determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Hashes must match the committed golden
        shell: bash
        run: |
          dotnet run -c Release --project src/Conduit.SimHarness -- hashes --duels 50 --matchup aggro:wall --seed-base 42 > got.txt
          if ! diff -u ci/determinism-golden.txt got.txt; then
            echo "::error::determinism drift on ${{ matrix.os }} — state hashes differ from golden"
            exit 1
          fi
          echo "determinism OK on ${{ matrix.os }}"

  nightly-bands:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: 10k-duel band report (balance §9 — report-only until playtests calibrate)
        shell: bash
        run: |
          dotnet run -c Release --project src/Conduit.SimHarness -- run --duels 10000 --matchup aggro:wall --seed-base 1000 | tee "$GITHUB_STEP_SUMMARY"
